services:
  # Frontend React + Nginx
  - type: web
    name: gestaoong-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    region: oregon

  # Backend Node.js
  - type: web
    name: gestaoong-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3000
      - key: DB_HOST
        value: gestaoong-db
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: rootpassword
      - key: DB_NAME
        value: gestaoong

  # Banco de Dados MySQL com Volume Persistente
  - type: web
    name: gestaoong-db
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile.mysql
    plan: free
    region: oregon
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1